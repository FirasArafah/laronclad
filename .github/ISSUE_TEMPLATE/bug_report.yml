name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please do not paste real queries, URLs, tokens,
        credentials or personal data. Replace them with a shape that shows the problem.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest steps or snippet that shows the problem.
    validations:
      required: true
  - type: input
    id: laronclad-version
    attributes:
      label: Laronclad version
      placeholder: 0.1.0-alpha
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "12.x"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From storage/logs/laronclad.log or the PHP error log. Remove anything sensitive first.
      render: shell
